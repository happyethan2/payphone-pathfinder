<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Payphone Pathfinder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0d0d1a; color: #dde; }

    #map { position: fixed; inset: 0; z-index: 0; }

    /* ── Panel (bottom sheet on mobile, side panel on ≥640px) ── */
    #panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(13, 13, 30, 0.96);
      border-top: 1px solid rgba(100,110,200,0.25);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; flex-direction: column;
      max-height: 78vh;
      transform: translateY(calc(100% - 52px));
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
    }
    #panel.open { transform: translateY(0); }

    #panel-handle {
      height: 52px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; user-select: none;
      border-bottom: 1px solid transparent;
    }
    #panel.open #panel-handle { border-bottom-color: rgba(100,110,200,0.15); }
    #panel-handle-pill {
      width: 36px; height: 4px;
      background: rgba(100,110,200,0.4); border-radius: 2px; flex-shrink: 0;
    }
    #panel-peek {
      font-size: 11px; color: #778; letter-spacing: 0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 220px;
    }

    #panel-body {
      padding: 8px 14px 20px;
      display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    /* ── Section ────────────────────────────────────────────── */
    .sec-title {
      font-size: 9px; font-weight: 700; color: #556;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
    }

    /* ── Inputs ─────────────────────────────────────────────── */
    input[type=text] {
      width: 100%; padding: 6px 9px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(100,110,200,0.2);
      border-radius: 7px; color: #dde; font-size: 12px; outline: none;
    }
    input[type=text]:focus { border-color: rgba(100,130,255,0.5); }
    input[type=text] + input[type=text] { margin-top: 5px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn-row { display: flex; gap: 5px; }

    button {
      flex: 1; padding: 7px 6px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(100,110,200,0.2);
      border-radius: 7px; color: #aab; font-size: 11px; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      min-height: 34px; white-space: nowrap; text-transform: capitalize;
    }
    button:hover  { background: rgba(100,110,200,0.15); color: #dde; }
    button.active { background: rgba(70,90,220,0.35); border-color: rgba(100,130,255,0.5); color: #c8d0ff; }
    button.danger { background: rgba(255,255,255,0.04); border-color: rgba(100,110,200,0.2); color: #778; }
    button.danger:hover { background: rgba(180,40,40,0.25); border-color: rgba(220,80,80,0.4); color: #f99; }
    button.go     { background: rgba(30,120,60,0.3); border-color: rgba(50,180,90,0.4); color: #7ee8a2; font-weight: 600; }
    button.go:hover { background: rgba(30,140,70,0.45); }
    button.maps   { background: rgba(30,80,160,0.3); border-color: rgba(60,130,255,0.4); color: #7ab8ff; font-weight: 600; }
    button.maps:hover { background: rgba(30,90,180,0.45); }
    button.tagged { background: rgba(30,140,70,0.35); border-color: rgba(50,200,100,0.45); color: #7ee8a2; font-weight: 700; }
    button.tagged:hover { background: rgba(30,160,80,0.5); }
    button.skipped { background: rgba(60,60,60,0.35); border-color: rgba(120,120,120,0.3); color: #999; font-weight: 700; }
    button.skipped:hover { background: rgba(80,80,80,0.5); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.icon-only { flex: none; padding: 7px 10px; }

    /* ── Legend dots ─────────────────────────────────────────── */
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #99a; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* ── Misc text ───────────────────────────────────────────── */
    .sub-text { font-size: 10px; color: #556; margin-top: 4px; }

    #endpoint-box {
      font-size: 10px; color: #667;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(100,110,200,0.1);
      border-radius: 6px; padding: 5px 8px; line-height: 1.8;
    }

    #route-result {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(100,110,200,0.15);
      border-radius: 7px; padding: 8px 10px; display: none;
    }
    #route-stats { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    #route-order { font-size: 10px; color: #556; line-height: 1.5; }

    /* ── Waypoint markers ────────────────────────────────────── */
    .wp {
      width: 22px; height: 22px; border-radius: 50%;
      background: #e67e22; color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 1px 5px rgba(0,0,0,0.6);
    }
    .wp-tagged  { background: #27ae60 !important; opacity: 0.75; }
    .wp-skipped { background: #555 !important; opacity: 0.55; color: #aaa; }
    @keyframes wp-pulse {
      0%   { box-shadow: 0 0 0 0   rgba(230,126,34,0.7), 0 1px 5px rgba(0,0,0,0.6); }
      70%  { box-shadow: 0 0 0 9px rgba(230,126,34,0),   0 1px 5px rgba(0,0,0,0.6); }
      100% { box-shadow: 0 0 0 0   rgba(230,126,34,0),   0 1px 5px rgba(0,0,0,0.6); }
    }
    .wp-active { animation: wp-pulse 2s ease-out infinite; }

    /* ── Spinner ─────────────────────────────────────────────── */
    #spinner {
      display: none; width: 18px; height: 18px; margin: 4px auto;
      border: 2px solid rgba(100,110,200,0.2); border-top-color: #6677ff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Live location dot ───────────────────────────────────── */
    .loc-dot {
      width: 13px; height: 13px; border-radius: 50%;
      background: #4a9eff; border: 2px solid #fff;
      animation: pulse 2.2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(74,158,255,0.7); }
      70%  { box-shadow: 0 0 0 11px rgba(74,158,255,0); }
      100% { box-shadow: 0 0 0 0   rgba(74,158,255,0); }
    }

    /* ── Floating buttons (bottom-right) ─────────────────────── */
    #fab-stack {
      position: fixed; bottom: 66px; right: 14px;
      z-index: 1001;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    #loc-badge {
      font-size: 9px; color: #556;
      background: rgba(13,13,30,0.85); border: 1px solid rgba(100,110,200,0.15);
      border-radius: 4px; padding: 2px 5px; white-space: nowrap;
    }
    #btn-minimap {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(13,13,30,0.92);
      border: 1px solid rgba(100,110,200,0.25);
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex: none; transition: background 0.15s;
    }
    #btn-minimap:hover { background: rgba(40,40,80,0.95); }
    #btn-minimap.active {
      background: rgba(60,60,140,0.85);
      border-color: rgba(140,150,255,0.5);
    }

    #fab-centre {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(13,13,30,0.92);
      border: 1px solid rgba(100,110,200,0.25);
      font-size: 20px; cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      flex: none; transition: background 0.15s;
    }
    #fab-centre:hover { background: rgba(40,40,80,0.95); }

    /* ── Desktop: revert to side panel ──────────────────────── */
    @media (min-width: 640px) {
      #panel {
        top: 10px; left: 10px; bottom: auto; right: auto;
        width: 290px; border-radius: 12px;
        border-top: 1px solid rgba(100,110,200,0.25);
        box-shadow: 0 4px 24px rgba(0,0,0,0.7);
        max-height: calc(100vh - 30px);
        transform: none !important; transition: none;
      }
      #panel.open { transform: none !important; }
      #panel-handle {
        height: auto; padding: 10px 12px 9px;
        justify-content: space-between;
        border-bottom-color: rgba(100,110,200,0.15) !important;
      }
      #panel-handle-pill { display: none; }
      #panel-peek {
        font-size: 13px; font-weight: 600; color: #c8ceff;
        max-width: none; letter-spacing: 0.3px;
      }
      #panel-body { max-height: calc(100vh - 110px); }
      #fab-stack   { bottom: 20px; }
    }

    /* ── Mobile: FABs at top-right so the bottom sheet never covers them ── */
    @media (max-width: 639px) {
      #fab-stack { top: 14px; bottom: auto; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- ── Control panel (bottom sheet) ──────────────────────────── -->
<div id="panel">
  <div id="panel-handle" onclick="togglePanel()">
    <div id="panel-handle-pill"></div>
    <span id="panel-peek">Payphone Pathfinder</span>
  </div>

  <div id="panel-body">

    <!-- Identity -->
    <div>
      <div class="sec-title">Identity</div>
      <div class="btn-row">
        <input type="text" id="username" placeholder="username" autocomplete="off" autocorrect="off" autocapitalize="off" style="flex:1;min-width:0;">
        <button id="btn-load" onclick="loadPhones()" style="flex:none;padding-left:10px;padding-right:10px;">Load phones</button>
      </div>
      <div id="load-status" class="sub-text"></div>
    </div>

    <!-- Legend -->
    <div>
      <div class="sec-title">Legend</div>
      <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#aaa"></span>Uncaptured</div>
        <div class="legend-item"><span class="dot" style="background:#2ecc71"></span>Mine</div>
        <div class="legend-item"><span class="dot" style="background:#3498db"></span>Cellmate</div>
        <div class="legend-item"><span class="dot" style="background:#e74c3c"></span>Hostile</div>
      </div>
    </div>

    <!-- Selection -->
    <div>
      <div class="sec-title">Selection</div>
      <div class="btn-row">
        <button id="btn-click" onclick="setMode('click')" class="active">Click</button>
        <button id="btn-lasso" onclick="setMode('lasso')">Lasso</button>
        <button onclick="clearSelection()" class="danger icon-only">✕</button>
      </div>
      <div class="btn-row" style="margin-top:5px">
        <button id="btn-exclude-owned" onclick="toggleExcludeOwned()" title="When active, lasso skips phones you already own">Skip owned</button>
      </div>
      <div id="sel-count" class="sub-text">0 selected</div>
    </div>

    <!-- Transport -->
    <div>
      <div class="sec-title">Transport</div>
      <div class="btn-row">
        <button id="btn-foot"    onclick="setProfile('foot')">🚶 Foot</button>
        <button id="btn-bicycle" onclick="setProfile('bicycle')">🚲 Bike</button>
        <button id="btn-car"     onclick="setProfile('car')"     class="active">🚗 Car</button>
      </div>
    </div>

    <!-- Endpoints -->
    <div>
      <div class="sec-title">Start &amp; End</div>
      <div class="btn-row">
        <button id="btn-set-endpoints" onclick="startSetEndpoints()">📍 Set Start &amp; End</button>
      </div>
    </div>

    <!-- Route -->
    <div>
      <div class="sec-title">Route</div>
      <div class="btn-row">
        <button onclick="findRoute()" id="btn-route" class="go">Find optimal route</button>
        <button onclick="clearRoute()" class="danger icon-only">✕</button>
      </div>
      <div id="spinner"></div>
      <div id="route-result" style="margin-top:10px;">
        <div id="route-stats"></div>
        <div id="maps-nav" style="display:none;margin-top:8px;">
          <!-- Stop indicator (LHS) + leg switcher (RHS) — card header -->
          <div style="display:flex;align-items:stretch;margin-bottom:8px;
                      background:rgba(255,255,255,0.05);
                      border:1px solid rgba(100,110,200,0.2);border-radius:9px;overflow:hidden;">
            <!-- LHS: stop indicator (shown when route active) -->
            <div id="stop-indicator" style="display:none;flex-direction:column;align-items:center;
                 justify-content:center;gap:4px;padding:9px 12px;
                 border-right:1px solid rgba(100,110,200,0.15);">
              <div style="font-size:8px;color:#556;text-transform:uppercase;letter-spacing:0.9px;">targeting</div>
              <div style="display:flex;align-items:center;gap:7px;margin-top:1px;">
                <div id="stop-badge" class="wp wp-active" style="width:32px;height:32px;font-size:14px;border-width:2.5px;flex-shrink:0;"></div>
                <span style="font-size:12px;color:#889;">/<span id="stop-total-label" style="color:#bbc;font-weight:700;font-size:13px;margin-left:3px;"></span></span>
              </div>
            </div>
            <!-- RHS: leg switcher (expands to fill when stop-indicator hidden) -->
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;
                 justify-content:center;gap:4px;padding:9px 6px;">
              <div style="font-size:8px;color:#556;text-transform:uppercase;letter-spacing:0.9px;">leg</div>
              <div style="display:flex;align-items:center;width:100%;margin-top:1px;">
                <span id="leg-prev-hint" onclick="changeLeg(-1)" role="button" tabindex="0"
                      aria-label="Previous leg"
                      onkeydown="if(event.key==='Enter'||event.key===' '){changeLeg(-1);event.preventDefault();}"
                      style="flex:1;display:flex;justify-content:flex-end;align-items:center;
                             padding:6px 8px;cursor:pointer;user-select:none;
                             font-size:18px;color:#889;line-height:1;transition:opacity 0.2s;">‹</span>
                <span id="leg-label" style="flex:2;text-align:center;font-size:12px;color:#ccd;
                                            white-space:nowrap;font-weight:600;pointer-events:none;"></span>
                <span id="leg-next-hint" onclick="changeLeg(1)" role="button" tabindex="0"
                      aria-label="Next leg"
                      onkeydown="if(event.key==='Enter'||event.key===' '){changeLeg(1);event.preventDefault();}"
                      style="flex:1;display:flex;justify-content:flex-start;align-items:center;
                             padding:6px 8px;cursor:pointer;user-select:none;
                             font-size:18px;color:#889;line-height:1;transition:opacity 0.2s;">›</span>
              </div>
            </div>
          </div>
          <!-- UNDO + SKIP -->
          <div id="tag-row" class="btn-row" style="margin-bottom:5px;display:none;">
            <button id="btn-revert" onclick="revertLeg()" class="danger" style="font-size:11px;flex:0.6;" disabled>↩ UNDO</button>
            <button onclick="tagCurrentLeg('skipped')" class="skipped" style="font-size:11px;">✕ SKIP</button>
          </div>
          <button onclick="openCurrentLeg()" class="maps" style="font-size:11px;width:100%;">
            Open in Google Maps ↗
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ── Status bar (set-endpoint prompts) ──────────────────────── -->
<div id="status-bar" style="
  display:none; position:fixed; bottom:52px; left:0; right:0; z-index:1002;
  background:rgba(13,13,30,0.95); border-top:1px solid rgba(100,110,200,0.25);
  padding:12px 20px; text-align:center;
  font-size:13px; color:#c8d0ff; letter-spacing:0.2px;">
</div>

<!-- ── Floating GPS button ─────────────────────────────────────── -->
<div id="fab-stack">
  <div id="loc-badge">no GPS</div>
  <button id="btn-minimap" onclick="toggleMiniMap()" title="Toggle mini-map">🗺</button>
  <button id="fab-centre" onclick="centreOnMe()" title="Centre on my location">📡</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────
const state = {
  phones:          [],
  markers:         {},
  selectedIds:     new Set(),
  mode:            'click',
  profile:         'car',
  start:           null,
  end:             null,
  startMarker:     null,
  endMarker:       null,
  routeLayers:     [],
  decorators:      [],
  waypointMarkers:      [],
  waypointMarkersById:  {},   // phone_id → L.Marker (for live state updates)
  nodeStates:           {},   // phone_id → 'tagged' | 'skipped'
  lassoPoints:     [],
  lassoLayer:      null,
  lassoDragging:   false,
  lassoExcludeOwned: false,
  lastRoute:       null,
  mapsLegs:        [],
  currentLeg:      0,
  routeProgress:   0,   // index into routeOrderedIds (current stop being visited)
  routeOrderedIds: [],  // ordered_ids of active route (set at display time, separate from lastRoute)
};

const STATUS_COLORS = {
  uncaptured: '#aaaaaa',
  mine:       '#2ecc71',
  cellmate:   '#3498db',
  hostile:    '#e74c3c',
};

// ── Map init ──────────────────────────────────────────────────────
const map = L.map('map', {
  center: [-25.0, 134.0], zoom: 5,
  zoomControl: false,        // we'll add it at bottom-left
  preferCanvas: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19,
}).addTo(map);

// Zoom control at bottom-left so it doesn't clash with panel
L.control.zoom({ position: 'bottomleft' }).addTo(map);

// Layer group for phone markers — no clustering, all dots always visible
const markerLayer = L.layerGroup().addTo(map);

// Mini-map (toggleable) — shares the same tile layer
let miniMap = null;
function toggleMiniMap() {
  if (miniMap) {
    miniMap.remove();
    miniMap = null;
    document.getElementById('btn-minimap').classList.remove('active');
  } else {
    const tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { attribution: '', maxZoom: 19 });
    miniMap = new L.Control.MiniMap(tiles, {
      position: 'bottomleft', width: 130, height: 100,
      zoomLevelOffset: -4, toggleDisplay: false,
    }).addTo(map);
    document.getElementById('btn-minimap').classList.add('active');
  }
}

const mapEl = map.getContainer();

// ── Panel (bottom sheet) ──────────────────────────────────────────
let panelOpen = false;
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('open', panelOpen);
}

// Swipe up on handle → open; swipe down → close
{
  let _sheetStartY = null;
  const handleEl = document.getElementById('panel-handle');
  handleEl.addEventListener('touchstart', e => {
    _sheetStartY = e.touches[0].clientY;
  }, { passive: true });
  handleEl.addEventListener('touchend', e => {
    if (_sheetStartY === null) return;
    const dy = e.changedTouches[0].clientY - _sheetStartY;
    _sheetStartY = null;
    if (Math.abs(dy) < 20) return; // tiny movement = tap, handled by onclick
    if (dy < 0 && !panelOpen) { panelOpen = true;  document.getElementById('panel').classList.add('open'); }
    else if (dy > 0 && panelOpen) { panelOpen = false; document.getElementById('panel').classList.remove('open'); }
  }, { passive: true });
}

function updatePanelPeek() {
  const el = document.getElementById('panel-peek');
  if (!el) return;
  const parts = [];
  if (state.phones.length)    parts.push(`${state.phones.length} phones`);
  if (state.selectedIds.size) parts.push(`${state.selectedIds.size} selected`);
  if (state.lastRoute) {
    const km = (state.lastRoute.total_distance_m / 1000).toFixed(1);
    parts.push(`${km} km route`);
  }
  el.textContent = parts.length ? parts.join(' · ') : 'Payphone Pathfinder';
}

// ── Load phones ───────────────────────────────────────────────────
async function loadPhones() {
  const username = document.getElementById('username').value.trim();
  if (!username) { setStatus('Enter username first', '#e74c3c'); return; }
  setStatus('Loading…', '#556');
  document.getElementById('btn-load').disabled = true;
  try {
    const res  = await fetch(`/api/phones?${new URLSearchParams({ username })}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.phones = data.phones;
    renderMarkers();
    setStatus(`${state.phones.length} phones loaded`, '#2ecc71');
    updatePanelPeek();
    restoreEndpointMarkers();
    const routeData = state.lastRoute;
    if (routeData) { displayRoute(routeData); state.lastRoute = routeData; }
    saveSession();
    startBackgroundRefresh();
  } catch (e) {
    setStatus(`Error: ${e.message}`, '#e74c3c');
  } finally {
    document.getElementById('btn-load').disabled = false;
  }
}

function setStatus(msg, color) {
  const el = document.getElementById('load-status');
  el.textContent = msg;
  el.style.color = color || '#556';
}

// ── Markers ───────────────────────────────────────────────────────
function renderMarkers() {
  markerLayer.clearLayers();
  state.markers = {};
  for (const phone of state.phones) {
    const m = makeMarker(phone);
    markerLayer.addLayer(m);
    state.markers[phone.id] = m;
  }
  updateSelCount();
}

function makeMarker(phone) {
  const sel   = state.selectedIds.has(phone.id);
  const color = STATUS_COLORS[phone.status] || '#888';
  const m = L.circleMarker([phone.lat, phone.lon], mkStyle(color, sel));
  const tip = [`#${phone.id}`, phone.status, phone.holder_name ? `held by ${phone.holder_name}` : null]
    .filter(Boolean).join('<br>');
  m.bindTooltip(tip, { direction: 'top', sticky: true });
  m.on('click', e => { L.DomEvent.stopPropagation(e); onMarkerClick(phone); });
  return m;
}

function markerRadius(sel) {
  const z = map.getZoom();
  const base = z >= 15 ? 7 : z >= 13 ? 5 : z >= 11 ? 3 : 2;
  return sel ? base + 2 : base;
}

// Waypoint (route stop) icon size — one tier larger than phone dots to stand out
function waypointSize() {
  const z = map.getZoom();
  return z >= 15 ? 22 : z >= 13 ? 17 : z >= 11 ? 12 : 8;
}

function makeWpIcon(label, extraClass) {
  const sz  = waypointSize();
  const fs  = Math.max(6, Math.round(sz * 0.44));
  const cls = ['wp', extraClass].filter(Boolean).join(' ');
  return L.divIcon({
    html: `<div class="${cls}" style="width:${sz}px;height:${sz}px;font-size:${fs}px">${sz >= 17 ? label : ''}</div>`,
    className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
  });
}

function mkStyle(color, sel) {
  return { radius: markerRadius(sel), fillColor: color, color: sel ? '#fff' : color,
           weight: sel ? 2.5 : 1, fillOpacity: 0.9, opacity: 1 };
}

function refreshMarker(phone) {
  const m = state.markers[phone.id];
  if (!m) return;
  const sel = state.selectedIds.has(phone.id);
  m.setStyle(mkStyle(STATUS_COLORS[phone.status] || '#888', sel));
  m.setRadius(markerRadius(sel));
}

// Scale all markers when zoom changes
map.on('zoomend', () => {
  // Phone dots
  for (const phone of state.phones) {
    const m = state.markers[phone.id];
    if (m) m.setRadius(markerRadius(state.selectedIds.has(phone.id)));
  }
  // Route waypoint markers
  for (const [idStr, m] of Object.entries(state.waypointMarkersById)) {
    const id     = parseInt(idStr);
    const ordIdx = state.routeOrderedIds.indexOf(id);
    if (ordIdx === -1) continue;
    const ns  = state.nodeStates[id];
    const cls = ns === 'skipped'                        ? 'wp-skipped'
              : ns === 'tagged'                         ? 'wp-tagged'
              : ordIdx === state.routeProgress          ? 'wp-active'
              : '';
    m.setIcon(makeWpIcon(ordIdx + 1, cls));
  }
});

function updateSelCount() {
  document.getElementById('sel-count').textContent =
    `${state.selectedIds.size} phone${state.selectedIds.size !== 1 ? 's' : ''} selected`;
  updatePanelPeek();
}

// ── Selection mode ────────────────────────────────────────────────
function setMode(mode) {
  mapEl.removeEventListener('touchstart', onLassoTouchStart);
  mapEl.removeEventListener('touchmove',  onLassoTouchMove);
  mapEl.removeEventListener('touchend',   onLassoTouchEnd);

  state.mode = mode;
  document.getElementById('btn-click').classList.toggle('active', mode === 'click');
  document.getElementById('btn-lasso').classList.toggle('active', mode === 'lasso');

  if (mode === 'lasso') {
    map.dragging.disable();
    if (map.tap) map.tap.disable();
    map.on('mousedown', onLassoStart);
    mapEl.addEventListener('touchstart', onLassoTouchStart, { passive: false });
    mapEl.addEventListener('touchmove',  onLassoTouchMove,  { passive: false });
    mapEl.addEventListener('touchend',   onLassoTouchEnd,   { passive: false });
  } else {
    map.dragging.enable();
    if (map.tap) map.tap.enable();
    map.off('mousedown', onLassoStart);
    cleanupLasso();
  }
}

function clearSelection() {
  state.selectedIds.clear();
  state.phones.forEach(p => refreshMarker(p));
  updateSelCount();
}

function toggleExcludeOwned() {
  state.lassoExcludeOwned = !state.lassoExcludeOwned;
  document.getElementById('btn-exclude-owned').classList.toggle('active', state.lassoExcludeOwned);
}

// ── Lasso (mouse) ─────────────────────────────────────────────────
function onLassoStart(e) {
  if (e.originalEvent.button !== 0) return;
  state.lassoPoints = [[e.latlng.lat, e.latlng.lng]];
  state.lassoDragging = true;
  map.on('mousemove', onLassoMove);
  map.on('mouseup',   onLassoEnd);
}
function onLassoMove(e) {
  if (!state.lassoDragging) return;
  state.lassoPoints.push([e.latlng.lat, e.latlng.lng]);
  drawLassoPreview();
}
function onLassoEnd() {
  state.lassoDragging = false;
  map.off('mousemove', onLassoMove);
  map.off('mouseup',   onLassoEnd);
  finishLasso();
}

// ── Lasso (touch — native DOM so passive:false works) ─────────────
function touchLatLng(e) {
  const t = e.touches[0];
  const r = mapEl.getBoundingClientRect();
  return map.containerPointToLatLng(L.point(t.clientX - r.left, t.clientY - r.top));
}
function onLassoTouchStart(e) {
  e.preventDefault();
  const ll = touchLatLng(e);
  state.lassoPoints  = [[ll.lat, ll.lng]];
  state.lassoDragging = true;
}
function onLassoTouchMove(e) {
  if (!state.lassoDragging) return;
  e.preventDefault();
  const ll = touchLatLng(e);
  state.lassoPoints.push([ll.lat, ll.lng]);
  drawLassoPreview();
}
function onLassoTouchEnd(e) {
  if (!state.lassoDragging) return;
  state.lassoDragging = false;
  finishLasso();
}

function drawLassoPreview() {
  if (state.lassoLayer) map.removeLayer(state.lassoLayer);
  if (state.lassoPoints.length < 2) return;
  state.lassoLayer = L.polygon(state.lassoPoints, {
    color: '#6677ff', fillColor: '#6677ff', fillOpacity: 0.08,
    weight: 1.5, dashArray: '5 4',
  }).addTo(map);
}
function finishLasso() {
  cleanupLasso();
  if (state.lassoPoints.length < 3) return;
  const poly = state.lassoPoints;
  state.phones.forEach(phone => {
    if (state.lassoExcludeOwned && phone.status === 'mine') return;
    if (pointInPolygon([phone.lat, phone.lon], poly)) {
      state.selectedIds.add(phone.id);
      refreshMarker(phone);
    }
  });
  state.lassoPoints = [];
  updateSelCount();
}
function cleanupLasso() {
  if (state.lassoLayer) { map.removeLayer(state.lassoLayer); state.lassoLayer = null; }
}
function pointInPolygon(pt, poly) {
  const [px, py] = pt;
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > py) !== (yj > py)) && px < (xj - xi) * (py - yi) / (yj - yi) + xi)
      inside = !inside;
  }
  return inside;
}

// ── Marker click ──────────────────────────────────────────────────
function onMarkerClick(phone) {
  if (state.mode === 'setStart') {
    setEndpoint('start', { lat: phone.lat, lon: phone.lon, phone_id: phone.id });
    return;
  }
  if (state.mode === 'setEnd') {
    setEndpoint('end', { lat: phone.lat, lon: phone.lon, phone_id: phone.id });
    return;
  }
  const adding = !state.selectedIds.has(phone.id);
  adding ? state.selectedIds.add(phone.id) : state.selectedIds.delete(phone.id);
  if (adding && navigator.vibrate) navigator.vibrate(18);
  refreshMarker(phone);
  updateSelCount();
}

// ── Endpoints ─────────────────────────────────────────────────────
function showStatusBar(msg) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.style.display = 'block';
}
function hideStatusBar() {
  document.getElementById('status-bar').style.display = 'none';
}

function startSetEndpoints() {
  document.getElementById('btn-set-endpoints').classList.add('active');
  setMode('setStart');
  showStatusBar('Tap your starting location on the map');
}

// Snap to nearest phone within SNAP_PX pixels, otherwise raw coords
const SNAP_PX = 44;
function snapPoint(latlng) {
  const clickPt = map.latLngToContainerPoint(latlng);
  let nearest = null, minDist = SNAP_PX;
  for (const phone of state.phones) {
    const pt = map.latLngToContainerPoint([phone.lat, phone.lon]);
    const d  = Math.hypot(clickPt.x - pt.x, clickPt.y - pt.y);
    if (d < minDist) { minDist = d; nearest = phone; }
  }
  return nearest
    ? { lat: nearest.lat, lon: nearest.lon, phone_id: nearest.id }
    : { lat: latlng.lat, lon: latlng.lng };
}

function setEndpoint(which, point) {
  state[which] = point;
  const oldKey = `${which}Marker`;
  if (state[oldKey]) map.removeLayer(state[oldKey]);
  const icon = L.divIcon({
    html: `<div style="width:12px;height:12px;border-radius:50%;
      background:${which === 'start' ? '#2ecc71' : '#e74c3c'};
      border:2px solid #fff;box-shadow:0 0 0 3px ${which === 'start' ? '#2ecc714d' : '#e74c3c4d'}"></div>`,
    className: '', iconSize: [12, 12], iconAnchor: [6, 6],
  });
  state[oldKey] = L.marker([point.lat, point.lon], { icon, zIndexOffset: 500 }).addTo(map);

  // Sequential flow: after start is set, automatically prompt for end
  if (which === 'start') {
    setMode('setEnd');
    showStatusBar('Now tap your ending location on the map');
  } else {
    setMode('click');
    hideStatusBar();
    document.getElementById('btn-set-endpoints').classList.remove('active');
  }
}

// ── Transport ─────────────────────────────────────────────────────
function setProfile(p) {
  state.profile = p;
  ['foot','bicycle','car'].forEach(n =>
    document.getElementById(`btn-${n}`).classList.toggle('active', n === p));
}

// ── Map click: endpoint setting with snap ─────────────────────────
map.on('click', (e) => {
  if (state.mode === 'setStart') {
    setEndpoint('start', snapPoint(e.latlng));
  } else if (state.mode === 'setEnd') {
    setEndpoint('end', snapPoint(e.latlng));
  }
});

// ── Route ─────────────────────────────────────────────────────────
async function findRoute() {
  if (!state.selectedIds.size) { alert('Select at least one phone first.'); return; }
  if (!state.start) { alert('Set a start point first.'); return; }
  if (!state.end)   { alert('Set an end point first.'); return; }

  document.getElementById('btn-route').disabled = true;
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('route-result').style.display = 'none';

  try {
    const res = await fetch('/api/route', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone_ids: Array.from(state.selectedIds),
        start: state.start, end: state.end, profile: state.profile,
      }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || `HTTP ${res.status}`); }
    const data = await res.json();
    displayRoute(data);
    state.lastRoute = data;
    updatePanelPeek();
    saveSession();
  } catch (e) {
    alert(`Route error: ${e.message}`);
  } finally {
    document.getElementById('btn-route').disabled = false;
    document.getElementById('spinner').style.display = 'none';
  }
}

// Generate n rainbow colours spread evenly across the visible spectrum (red → violet).
// Adjacent legs share similar hues so the path reads as a continuous gradient.
function rainbowColors(n) {
  if (n <= 0) return [];
  if (n === 1) return ['hsl(200,82%,57%)'];
  return Array.from({ length: n }, (_, i) => {
    const hue = Math.round((i / (n - 1)) * 280);  // 0° red → 280° violet
    return `hsl(${hue},82%,57%)`;
  });
}

function displayRoute(data) {
  clearRoute();
  const { ordered_ids, path, total_distance_m, total_duration_s } = data;
  state.routeOrderedIds = ordered_ids;   // available before state.lastRoute is set

  const legColors = rainbowColors(path.features.length);
  path.features.forEach((feature, idx) => {
    const color  = legColors[idx];
    const coords = feature.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
    const line   = L.polyline(coords, { color, weight: 4, opacity: 0.85 }).addTo(map);
    state.routeLayers.push(line);
    const dec = L.polylineDecorator(line, { patterns: [{ offset: '10%', repeat: 110,
      symbol: L.Symbol.arrowHead({ pixelSize: 9, fill: true, fillOpacity: 1,
        pathOptions: { color, weight: 0 } }) }] }).addTo(map);
    state.decorators.push(dec);
  });

  state.nodeStates = {};
  state.routeProgress = 0;
  state.waypointMarkersById = {};
  ordered_ids.forEach((id, idx) => {
    const phone = state.phones.find(p => p.id === id);
    if (!phone) return;
    const icon = makeWpIcon(idx + 1);
    const m = L.marker([phone.lat, phone.lon], { icon, zIndexOffset: (ordered_ids.length - idx) * 10 }).addTo(map);
    state.waypointMarkers.push(m);
    state.waypointMarkersById[id] = m;
  });

  const allCoords = path.features.flatMap(f => f.geometry.coordinates.map(([lon, lat]) => [lat, lon]));
  if (allCoords.length) map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });

  const km   = (total_distance_m / 1000).toFixed(1);
  const mins = Math.round(total_duration_s / 60);
  document.getElementById('route-stats').textContent = `${km} km · ${mins} min · ${ordered_ids.length} stops`;
  document.getElementById('route-result').style.display = 'block';
  updateMapsLink(data);
}

function clearRoute() {
  state.routeLayers.forEach(l => map.removeLayer(l));
  state.decorators.forEach(d => map.removeLayer(d));
  state.waypointMarkers.forEach(m => map.removeLayer(m));
  state.routeLayers = []; state.decorators = []; state.waypointMarkers = [];
  state.waypointMarkersById = {}; state.nodeStates = {};
  state.routeProgress = 0; state.routeOrderedIds = [];
  state.lastRoute = null;
  updateMapsLink(null);
  document.getElementById('route-result').style.display   = 'none';
  document.getElementById('stop-indicator').style.display = 'none';
  updatePanelPeek();
  saveSession();
}

// ── Google Maps legs ──────────────────────────────────────────────
// Google Maps URL scheme: origin + up to 8 waypoints + destination = 10 stops per leg.
// Consecutive legs share one stop (the handoff point), so each leg advances 9 stops.
const GMAPS_STOPS_PER_LEG = 10; // origin + 8 waypoints + destination

function buildLegs(data) {
  if (!data || !state.start || !state.end) return [];

  const phoneLookup = Object.fromEntries(state.phones.map(p => [p.id, p]));
  const mode = { foot: 'walking', bicycle: 'bicycling', car: 'driving' }[state.profile] || 'walking';

  // Full ordered stop list as [lat, lon] pairs
  const all = [
    [state.start.lat, state.start.lon],
    ...data.ordered_ids.map(id => { const p = phoneLookup[id]; return p ? [p.lat, p.lon] : null; }).filter(Boolean),
    [state.end.lat, state.end.lon],
  ];

  if (all.length < 2) return [];

  // comgooglemaps:// scheme: saddr + daddr joined with +to: (no separate waypoints param)
  // Each leg: origin + up to 9 more stops = 10 total, overlap of 1 between legs
  const appMode = { foot: 'walking', bicycle: 'bicycling', car: 'driving' }[state.profile] || 'driving';
  const legs = [];
  const advance = GMAPS_STOPS_PER_LEG - 1; // 9
  for (let i = 0; i < all.length - 1; i += advance) {
    const chunk  = all.slice(i, i + GMAPS_STOPS_PER_LEG);
    const saddr  = chunk[0].join(',');
    const daddr  = chunk.slice(1).map(s => s.join(',')).join('+to:');
    // Native app URL — opens Google Maps directly without browser redirect
    const appUrl = `comgooglemaps://?saddr=${saddr}&daddr=${daddr}&directionsmode=${appMode}`;
    // Web fallback in case app isn't installed
    const origin = chunk[0].join(',');
    const dest   = chunk[chunk.length - 1].join(',');
    const wpts   = chunk.slice(1, -1).map(s => s.join(',')).join('|');
    const webUrl = `https://www.google.com/maps/dir/?api=1` +
      `&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}` +
      (wpts ? `&waypoints=${encodeURIComponent(wpts)}` : '') +
      `&travelmode=${mode}`;
    legs.push({ appUrl, webUrl, firstStop: i, lastStop: Math.min(i + advance, all.length - 1) });
  }
  return legs;
}

function updateMapsLink(data) {
  const nav = document.getElementById('maps-nav');
  if (!data) { nav.style.display = 'none'; return; }

  state.mapsLegs   = buildLegs(data);
  state.currentLeg = 0;
  nav.style.display = state.mapsLegs.length ? 'block' : 'none';
  renderLeg();
}

// Map a routeProgress index → the appropriate mapsLegs index.
// all[] = [start, phone_0, ..., phone_N, end], so targetIdx = prog + 1.
// Returns the latest leg whose firstStop ≤ targetIdx (legs overlap by 1 stop).
function legForProgress(prog) {
  const targetIdx = prog + 1;
  let best = 0;
  for (let j = 0; j < state.mapsLegs.length; j++) {
    if (state.mapsLegs[j].firstStop <= targetIdx) best = j;
  }
  return best;
}

function renderLeg() {
  const legs = state.mapsLegs;
  if (!legs.length) return;

  // Auto-advance currentLeg to follow the current target stop (never retreat it here)
  const prog = state.routeProgress;
  if (state.routeOrderedIds.length && prog < state.routeOrderedIds.length) {
    const correctLeg = legForProgress(prog);
    if (correctLeg > state.currentLeg) state.currentLeg = correctLeg;
  }

  const i    = state.currentLeg;
  const leg  = legs[i];
  const total = legs.length;

  // Human-readable label: "Leg 2 of 7"  or just "All stops" if only 1 leg
  const label = total === 1
    ? 'All stops'
    : `Leg ${i + 1} of ${total}`;
  document.getElementById('leg-label').textContent = label;

  // Chevron state: dim when navigation in that direction is locked/unavailable
  const minLeg = (state.routeOrderedIds.length && prog < state.routeOrderedIds.length)
    ? legForProgress(prog) : 0;
  const canBack = i > minLeg;
  const canFwd  = i < total - 1;
  document.getElementById('leg-prev-hint').style.opacity = canBack ? '0.65' : '0.18';
  document.getElementById('leg-next-hint').style.opacity = canFwd  ? '0.65' : '0.18';

  // Stop indicator + SKIP row — visible while there are still phones to visit
  const tagRow  = document.getElementById('tag-row');
  const stopInd = document.getElementById('stop-indicator');
  const orderedIds = state.routeOrderedIds;
  const prog = state.routeProgress;
  if (orderedIds.length && prog < orderedIds.length) {
    stopInd.style.display = 'flex';
    document.getElementById('stop-badge').textContent       = prog + 1;
    document.getElementById('stop-total-label').textContent = orderedIds.length;
    tagRow.style.display = 'flex';
    document.getElementById('btn-revert').disabled = prog === 0;
    tagRow.children[1].textContent = '✕ SKIP';
  } else {
    stopInd.style.display = 'none';
    tagRow.style.display  = 'none';
  }

  // Refresh waypoint marker classes: active pulse on current target, correct state on others
  for (const [idStr, m] of Object.entries(state.waypointMarkersById)) {
    const id     = parseInt(idStr);
    const ordIdx = orderedIds.indexOf(id);
    if (ordIdx === -1) continue;
    const ns  = state.nodeStates[id];
    const cls = ns === 'skipped' ? 'wp-skipped'
              : ns === 'tagged'  ? 'wp-tagged'
              : ordIdx === prog  ? 'wp-active'
              : '';
    m.setIcon(makeWpIcon(ordIdx + 1, cls));
  }
}

function changeLeg(delta) {
  const prog   = state.routeProgress;
  const minLeg = (state.routeOrderedIds.length && prog < state.routeOrderedIds.length)
    ? legForProgress(prog) : 0;
  state.currentLeg = Math.max(minLeg, Math.min(state.mapsLegs.length - 1, state.currentLeg + delta));
  renderLeg();
  if (delta !== 0 && navigator.vibrate) navigator.vibrate(12);
}

function tagCurrentLeg(action) {
  // action: 'skipped' (tagged state is determined automatically by API refresh)
  const orderedIds = state.routeOrderedIds;
  if (state.routeProgress >= orderedIds.length) return;

  const phoneId = orderedIds[state.routeProgress];
  const ordIdx  = state.routeProgress;
  state.nodeStates[phoneId] = action;

  // Update waypoint marker icon with skipped state class
  const m = state.waypointMarkersById[phoneId];
  if (m) {
    m.setIcon(makeWpIcon(ordIdx + 1, 'wp-skipped'));
  }

  if (navigator.vibrate) navigator.vibrate(10);
  state.routeProgress++;
  renderLeg();
}

function revertLeg() {
  if (state.routeProgress <= 0) return;
  state.routeProgress--;

  const orderedIds = state.routeOrderedIds;
  const phoneId    = orderedIds[state.routeProgress];
  const ordIdx     = state.routeProgress;
  delete state.nodeStates[phoneId];

  // Restore waypoint marker to its original (unmarked) icon
  const m = state.waypointMarkersById[phoneId];
  if (m) {
    m.setIcon(makeWpIcon(ordIdx + 1));
  }

  if (navigator.vibrate) navigator.vibrate(8);
  renderLeg();
}

// ── Swipe gesture on #maps-nav ────────────────────────────────────
{
  let _swipeX = null, _swipeY = null;
  const navEl = document.getElementById('maps-nav');
  navEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    _swipeX = t.clientX; _swipeY = t.clientY;
  }, { passive: true });
  navEl.addEventListener('touchend', e => {
    if (_swipeX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - _swipeX;
    const dy = t.clientY - _swipeY;
    _swipeX = _swipeY = null;
    // Require horizontal displacement ≥ 40px, more horizontal than vertical
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    changeLeg(dx < 0 ? 1 : -1);   // swipe left → next, swipe right → prev
  }, { passive: true });
}

function openCurrentLeg() {
  const leg = state.mapsLegs[state.currentLeg];
  if (!leg) return;
  if (/Android/.test(navigator.userAgent)) {
    // Android doesn't recognise comgooglemaps://; open the web URL in a new tab so
    // Chrome's App Links can hand off to the Google Maps app without losing this page.
    window.open(leg.webUrl, '_blank');
  } else {
    // iOS (and unknown platforms): comgooglemaps:// hands off to the GMaps app
    // without navigating this page away.
    window.location.href = leg.appUrl;
  }
}

// ── Geolocation ───────────────────────────────────────────────────
const locIcon = L.divIcon({ html: '<div class="loc-dot"></div>',
  className: '', iconSize: [13, 13], iconAnchor: [6, 6] });

let locMarker = null, locCircle = null, lastLatLng = null;

function startGeolocation() {
  if (!navigator.geolocation) { setLocBadge('no GPS'); return; }
  navigator.geolocation.watchPosition(onPosition, onPositionError,
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
}

function onPosition(pos) {
  const { latitude: lat, longitude: lon, accuracy } = pos.coords;
  lastLatLng = [lat, lon];
  if (!locMarker) locMarker = L.marker([lat, lon], { icon: locIcon, zIndexOffset: 1000 }).addTo(map);
  else locMarker.setLatLng([lat, lon]);
  if (!locCircle) locCircle = L.circle([lat, lon], { radius: accuracy, color: '#4a9eff',
    fillColor: '#4a9eff', fillOpacity: 0.07, weight: 1 }).addTo(map);
  else locCircle.setLatLng([lat, lon]).setRadius(accuracy);
  setLocBadge(`±${Math.round(accuracy)} m`);
}

function onPositionError(err) {
  if (err.code === 1 && location.protocol === 'http:' && location.hostname !== 'localhost') {
    setLocBadge('needs HTTPS');
  } else {
    setLocBadge(err.code === 3 ? 'GPS timeout' : 'GPS denied');
  }
}

function setLocBadge(txt) { document.getElementById('loc-badge').textContent = txt; }

function centreOnMe() {
  if (lastLatLng) { map.setView(lastLatLng, Math.max(map.getZoom(), 16)); return; }
  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    pos => map.setView([pos.coords.latitude, pos.coords.longitude], 16),
    () => {}, { enableHighAccuracy: true, timeout: 10000 }
  );
}

startGeolocation();

// ── Session persistence ───────────────────────────────────────────
const SESSION_KEY = 'payphone_pathfinder_session';

function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      username:    document.getElementById('username').value.trim(),
      profile:     state.profile,
      selectedIds: Array.from(state.selectedIds),
      start:       state.start,
      end:         state.end,
      lastRoute:   state.lastRoute,
    }));
  } catch (_) {}
}

function restoreSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.username)    document.getElementById('username').value = s.username;
    if (s.profile)     setProfile(s.profile);
    if (s.selectedIds) s.selectedIds.forEach(id => state.selectedIds.add(id));
    if (s.start)       state.start     = s.start;
    if (s.end)         state.end       = s.end;
    if (s.lastRoute)   state.lastRoute = s.lastRoute;
    return !!s.username;
  } catch (_) {
    return false;
  }
}

function restoreEndpointMarkers() {
  ['start', 'end'].forEach(which => {
    const point = state[which];
    if (!point) return;
    const markerKey = `${which}Marker`;
    if (state[markerKey]) map.removeLayer(state[markerKey]);
    const icon = L.divIcon({
      html: `<div style="width:12px;height:12px;border-radius:50%;
        background:${which === 'start' ? '#2ecc71' : '#e74c3c'};
        border:2px solid #fff;box-shadow:0 0 0 3px ${which === 'start' ? '#2ecc714d' : '#e74c3c4d'}"></div>`,
      className: '', iconSize: [12, 12], iconAnchor: [6, 6],
    });
    state[markerKey] = L.marker([point.lat, point.lon], { icon, zIndexOffset: 500 }).addTo(map);
  });
}

// ── Background phone refresh ──────────────────────────────────────
let refreshTimer = null;
const REFRESH_INTERVAL_MS = 10 * 1000;  // 10s — safe with 30s server-side cache

async function refreshPhones() {
  const username = document.getElementById('username').value.trim();
  if (!username || !state.phones.length) return;
  try {
    const res = await fetch(`/api/phones?${new URLSearchParams({ username })}`);
    if (!res.ok) return;
    const data   = await res.json();
    const newMap = Object.fromEntries(data.phones.map(p => [p.id, p]));
    let changed  = 0;
    for (const phone of state.phones) {
      const updated = newMap[phone.id];
      if (!updated) continue;
      if (updated.status !== phone.status || updated.holder_name !== phone.holder_name) {
        phone.status      = updated.status;
        phone.holder_name = updated.holder_name;
        const m = state.markers[phone.id];
        if (m) {
          const tip = [`#${phone.id}`, phone.status,
            phone.holder_name ? `held by ${phone.holder_name}` : null]
            .filter(Boolean).join('<br>');
          m.setTooltipContent(tip);
          refreshMarker(phone);
        }
        changed++;
      }
    }
    // Auto-advance route progress when the current target stop is tagged as ours
    while (
      state.routeOrderedIds.length &&
      state.routeProgress < state.routeOrderedIds.length &&
      !state.nodeStates[state.routeOrderedIds[state.routeProgress]]
    ) {
      const targetId    = state.routeOrderedIds[state.routeProgress];
      const targetPhone = state.phones.find(p => p.id === targetId);
      if (!targetPhone || targetPhone.status !== 'mine') break;
      // Mark waypoint as tagged and advance
      const ordIdx = state.routeProgress;
      const m = state.waypointMarkersById[targetId];
      if (m) m.setIcon(makeWpIcon(ordIdx + 1, 'wp-tagged'));
      state.nodeStates[targetId] = 'tagged';
      state.routeProgress++;
      if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
      renderLeg();
    }

    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setStatus(`Updated ${now}${changed ? ` · ${changed} changed` : ''}`, '#2ecc71');
  } catch (_) {}
}

async function manualRefreshPhones() {
  // Bust the server-side cache so we get a live upstream fetch, then refresh.
  try { await fetch('/api/phones/refresh', { method: 'POST' }); } catch (_) {}
  await refreshPhones();
}

function startBackgroundRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshPhones, REFRESH_INTERVAL_MS);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveSession();
});

// ── URL prefill ───────────────────────────────────────────────────
(function() {
  restoreSession();
  const p = new URLSearchParams(location.search);
  if (p.get('username')) document.getElementById('username').value = p.get('username');
  const hasUsername = document.getElementById('username').value.trim();
  if (hasUsername) {
    panelOpen = true;
    document.getElementById('panel').classList.add('open');
    loadPhones();
  }
})();
</script>
