services:
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    command: osrm-routed --algorithm mld --max-table-size 200 /data/australia-latest.osrm
    volumes:
      - ./osrm-data/foot:/data:ro
    networks:
      - payphone-net
    restart: unless-stopped
    # Uncomment to expose for debugging: ports: ["5001:5000"]

  osrm-bicycle:
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    command: osrm-routed --algorithm mld --max-table-size 200 /data/australia-latest.osrm
    volumes:
      - ./osrm-data/bicycle:/data:ro
    networks:
      - payphone-net
    restart: unless-stopped
    # Uncomment to expose for debugging: ports: ["5002:5000"]

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    command: osrm-routed --algorithm mld --max-table-size 200 /data/australia-latest.osrm
    volumes:
      - ./osrm-data/car:/data:ro
    networks:
      - payphone-net
    restart: unless-stopped
    # Uncomment to expose for debugging: ports: ["5003:5000"]

  vroom:
    image: vroomvrp/vroom-docker:v1.13.0
    volumes:
      - ./vroom-config:/conf
    networks:
      - payphone-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-unknown}   # set by deploy.sh from git describe
    pull_policy: build   # built locally from source; never pull from a registry
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./backend/certs:/app/certs:ro
    env_file:
      - .env
    environment:
      OSRM_FOOT_URL: http://osrm-foot:5000
      OSRM_BICYCLE_URL: http://osrm-bicycle:5000
      OSRM_CAR_URL: http://osrm-car:5000
      VROOM_URL: http://vroom:3000
    depends_on:
      - osrm-foot
      - osrm-bicycle
      - osrm-car
      - vroom
    networks:
      - payphone-net
    restart: unless-stopped

  # Public access through a Cloudflare Tunnel: an outbound connection, so no router ports
  # open, and only the hostname routed to the backend in the Cloudflare dashboard is
  # reachable. Off unless .env sets COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - backend
    networks:
      - payphone-net
    restart: unless-stopped

networks:
  payphone-net:
    driver: bridge
